syntax = "proto3";

package tests.store;

option go_package = "github.com/romannikov/fdb-layer/tests/go/store;store";

import "fdb-layer/annotations.proto";

message User {
    option (annotations.type_id) = 1;
    option (annotations.primary_key) = {
        fields: ["id"]
    };
    option (annotations.secondary_index) = {
        id: 1,
        fields: ["email"]
    };

    string id = 1;
    string name = 2;
    string email = 3;
}

message Product {
    option (annotations.type_id) = 2;
    option (annotations.primary_key) = {
        fields: ["id"]
    };
    option (annotations.secondary_index) = {
        id: 1,
        fields: ["category"]
    };
    option (annotations.secondary_index) = {
        id: 2,
        fields: ["category"],
        aggregate: AGGREGATE_COUNT
    };
    option (annotations.secondary_index) = {
        id: 3,
        fields: ["category"],
        aggregate: AGGREGATE_SUM,
        aggregate_field: "price"
    };
    option (annotations.secondary_index) = {
        id: 4,
        fields: ["category"],
        aggregate: AGGREGATE_MIN,
        aggregate_field: "price"
    };
    option (annotations.secondary_index) = {
        id: 5,
        fields: ["category"],
        aggregate: AGGREGATE_MAX,
        aggregate_field: "price"
    };
    option (annotations.secondary_index) = {
        id: 6,
        fields: [],
        aggregate: AGGREGATE_COUNT
    };

    string id = 1;
    string name = 2;
    string category = 3;
    int32 price = 4;
}

message Post {
    option (annotations.type_id) = 3;
    option (annotations.primary_key) = {
        fields: ["id"]
    };
    option (annotations.secondary_index) = {
        id: 1,
        fields: ["tags"]
    };
    option (annotations.secondary_index) = {
        id: 2,
        fields: ["tags"],
        aggregate: AGGREGATE_COUNT
    };
    option (annotations.secondary_index) = {
        id: 3,
        fields: ["id"],
        mutation: MUTATION_COUNT
    };
    option (annotations.secondary_index) = {
        id: 4,
        fields: ["id"],
        mutation: MUTATION_ADD,
        name: "likes"
    };
    option (annotations.secondary_index) = {
        id: 5,
        fields: ["id"],
        mutation: MUTATION_MIN,
        name: "latency"
    };
    option (annotations.secondary_index) = {
        id: 6,
        fields: ["id"],
        mutation: MUTATION_MAX,
        name: "latency"
    };
    option (annotations.secondary_index) = {
        id: 7,
        fields: [],
        mutation: MUTATION_COUNT,
        name: "global_views"
    };

    string id = 1;
    repeated string tags = 2;
}

message TaskMessage {
    option (annotations.type_id) = 4;
    option (annotations.is_queue) = true;
    option (annotations.primary_key) = {
        fields: ["queue_name", "shard_id", "versionstamp"]
    };

    string queue_name = 1;
    uint32 shard_id = 2;
    bytes versionstamp = 3 [(annotations.is_versionstamp) = true];
    bytes payload = 4;
}

enum OrderStatus {
    ORDER_STATUS_UNSPECIFIED = 0;
    ORDER_STATUS_PENDING = 1;
    ORDER_STATUS_SHIPPED = 2;
}

message Order {
    option (annotations.type_id) = 100;
    option (annotations.primary_key) = {
        fields: ["tenant_id", "order_seq"]
    };

    option (annotations.secondary_index) = {
        id: 1001,
        fields: ["status", "created_at"]
    };
    option (annotations.secondary_index) = {
        id: 1002,
        fields: ["receipt_hash"]
    };
    option (annotations.secondary_index) = {
        id: 1003,
        fields: ["attachment_hashes"]
    };
    option (annotations.secondary_index) = {
        id: 1004,
        fields: ["status", "attachment_hashes"]
    };
    option (annotations.secondary_index) = {
        id: 1005,
        fields: ["tenant_id", "status"],
        aggregate: AGGREGATE_COUNT
    };
    option (annotations.secondary_index) = {
        id: 1006,
        fields: ["tenant_id"],
        aggregate: AGGREGATE_SUM,
        aggregate_field: "created_at"
    };
    option (annotations.secondary_index) = {
        id: 1007,
        fields: ["tenant_id", "status"],
        mutation: MUTATION_ADD,
        name: "retries"
    };
    option (annotations.secondary_index) = {
        id: 1008,
        fields: ["order_seq", "tenant_id"],
        mutation: MUTATION_COUNT,
        name: "attempts"
    };
    option (annotations.secondary_index) = {
        id: 1009,
        fields: ["status", "attachment_hashes"],
        aggregate: AGGREGATE_SUM,
        aggregate_field: "created_at"
    };
    option (annotations.secondary_index) = {
        id: 1010,
        fields: ["tenant_id"],
        aggregate: AGGREGATE_MAX,
        aggregate_field: "total_units"
    };
    option (annotations.secondary_index) = {
        id: 1011,
        fields: ["tenant_id"],
        aggregate: AGGREGATE_MIN,
        aggregate_field: "total_units"
    };
    option (annotations.secondary_index) = {
        id: 1012,
        fields: [],
        aggregate: AGGREGATE_SUM,
        aggregate_field: "created_at"
    };
    option (annotations.secondary_index) = {
        id: 1013,
        fields: [],
        aggregate: AGGREGATE_MIN,
        aggregate_field: "created_at"
    };
    option (annotations.secondary_index) = {
        id: 1014,
        fields: [],
        aggregate: AGGREGATE_MAX,
        aggregate_field: "created_at"
    };
    option (annotations.secondary_index) = {
        id: 1015,
        fields: ["tenant_id", "status", "created_at"]
    };
    option (annotations.secondary_index) = {
        id: 1016,
        fields: ["order_seq", "tenant_id"]
    };

    enum Priority {
        PRIORITY_LOW = 0;
        PRIORITY_HIGH = 1;
    }

    message ShippingAddress {
        string city = 1;
        string country = 2;
    }

    string tenant_id = 1;
    int32 order_seq = 2;
    OrderStatus status = 3;
    int64 created_at = 4;
    bytes receipt_hash = 5;
    repeated bytes attachment_hashes = 6;
    Priority priority = 7;
    ShippingAddress address = 8;
    repeated ShippingAddress history = 9;
    uint64 total_units = 10;
}

message AuditLog {
    option (annotations.type_id) = 5;
    option (annotations.primary_key) = {
        fields: ["log_id"]
    };
    option (annotations.secondary_index) = {
        id: 1,
        fields: ["actor"]
    };
    option (annotations.secondary_index) = {
        id: 2,
        fields: ["tags"]
    };

    bytes log_id = 1 [(annotations.is_versionstamp) = true];
    string actor = 2;
    repeated string tags = 3;
    int64 views = 4;
}
