syntax = "proto3";

package tests.store;

option go_package = "github.com/romannikov/fdb-layer/tests/go/store;store";

import "fdb-layer/annotations.proto";

message User {
    option (annotations.type_id) = 1;
    option (annotations.primary_key) = {
        fields: ["id"]
    };
    option (annotations.secondary_index) = {
        id: 2324124615
        fields: ["email"]
    };

    string id = 1;
    string name = 2;
    string email = 3;
}

message Product {
    option (annotations.type_id) = 2;
    option (annotations.primary_key) = {
        fields: ["id"]
    };
    option (annotations.secondary_index) = {
        id: 3475980913
        fields: ["category"]
    };

    string id = 1;
    string name = 2;
    string category = 3;
    int32 price = 4;
}

message Post {
    option (annotations.type_id) = 3;
    option (annotations.primary_key) = {
        fields: ["id"]
    };
    option (annotations.secondary_index) = {
        id: 4095142816
        fields: ["tags"]
    };

    string id = 1;
    repeated string tags = 2;
}

message TaskMessage {
    option (annotations.type_id) = 4;
    option (annotations.is_queue) = true;
    option (annotations.primary_key) = {
        fields: ["queue_name", "shard_id", "versionstamp"]
    };

    string queue_name = 1;
    uint32 shard_id = 2;
    bytes versionstamp = 3 [(annotations.is_versionstamp) = true];
    bytes payload = 4;
}

enum OrderStatus {
    ORDER_STATUS_UNSPECIFIED = 0;
    ORDER_STATUS_PENDING = 1;
    ORDER_STATUS_SHIPPED = 2;
}

message Order {
    option (annotations.type_id) = 100;
    option (annotations.primary_key) = {
        fields: ["tenant_id", "order_seq"]
    };

    option (annotations.secondary_index) = {
        id: 1001
        fields: ["status", "created_at"]
    };
    option (annotations.secondary_index) = {
        id: 1002
        fields: ["receipt_hash"]
    };
    option (annotations.secondary_index) = {
        id: 1003
        fields: ["attachment_hashes"]
    };
    option (annotations.secondary_index) = {
        id: 1004
        fields: ["status", "attachment_hashes"]
    };

    enum Priority {
        PRIORITY_LOW = 0;
        PRIORITY_HIGH = 1;
    }

    message ShippingAddress {
        string city = 1;
        string country = 2;
    }

    string tenant_id = 1;
    int32 order_seq = 2;
    OrderStatus status = 3;
    int64 created_at = 4;
    bytes receipt_hash = 5;
    repeated bytes attachment_hashes = 6;
    Priority priority = 7;
    ShippingAddress address = 8;
    repeated ShippingAddress history = 9;
}

message AuditLog {
    option (annotations.type_id) = 5;
    option (annotations.primary_key) = {
        fields: ["log_id"]
    };
    option (annotations.secondary_index) = {
        id: 1
        fields: ["actor"]
    };
    option (annotations.secondary_index) = {
        id: 2
        fields: ["tags"]
    };

    bytes log_id = 1 [(annotations.is_versionstamp) = true];
    string actor = 2;
    repeated string tags = 3;
    int64 views = 4 [(annotations.mutation) = MUTATION_ADD];
}

message Customer {
    option (annotations.type_id) = 200;
    option (annotations.primary_key) = {
        fields: ["customer_id"]
    };
    option (annotations.secondary_index) = {
        id: 1
        fields: ["email"]
        unique: true
    };
    option (annotations.secondary_index) = {
        id: 2
        fields: ["referral_code"]
        sparse: true
    };

    string customer_id = 1;
    string email = 2;
    string name = 3;
    string referral_code = 4;
}

message CustomerInvoice {
    option (annotations.type_id) = 201;
    option (annotations.primary_key) = {
        fields: ["customer_id", "invoice_id"]
    };
    option (annotations.interleave) = {
        parent: "Customer"
        on_delete_cascade: true
    };
    option (annotations.secondary_index) = {
        id: 1
        fields: ["status", "issued_at"]
        storing: ["amount_cents"]
    };
    option (annotations.secondary_index) = {
        id: 2
        fields: ["customer_id", "status"]
        aggregate: AGGREGATE_COUNT
    };
    option (annotations.secondary_index) = {
        id: 3
        fields: ["customer_id", "status"]
        aggregate: AGGREGATE_SUM
        aggregate_field: "amount_cents"
    };
    option (annotations.secondary_index) = {
        id: 4
        fields: ["customer_id"]
        aggregate: AGGREGATE_MIN
        aggregate_field: "amount_cents"
    };
    option (annotations.secondary_index) = {
        id: 5
        fields: ["customer_id"]
        aggregate: AGGREGATE_MAX
        aggregate_field: "amount_cents"
    };

    string customer_id = 1;
    int64 invoice_id = 2;
    OrderStatus status = 3;
    int64 issued_at = 4;
    int64 amount_cents = 5;
    string note = 6;
}

message SimpleSetting {
    option (annotations.type_id) = 202;
    option (annotations.primary_key) = {
        fields: ["key"]
    };

    string key = 1;
    string value = 2;
}
