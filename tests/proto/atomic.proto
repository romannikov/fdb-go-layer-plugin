syntax = "proto3";

package tests.atomic;

option go_package = "github.com/romannikov/fdb-layer/tests/go/atomic;atomic";

import "fdb-layer/annotations.proto";

message Counter {
    option (annotations.primary_key) = "id";
    string id = 1;
    int64 value = 2 [(annotations.mutation) = MUTATION_ADD];
    int64 max_value = 3 [(annotations.mutation) = MUTATION_MAX];
    int64 min_value = 4 [(annotations.mutation) = MUTATION_MIN];
    uint64 u64_max = 5 [(annotations.mutation) = MUTATION_MAX];
    int32 i32_min = 6 [(annotations.mutation) = MUTATION_MIN];
    uint32 u32_add = 7 [(annotations.mutation) = MUTATION_ADD];
}
