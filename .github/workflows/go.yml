name: CI

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Install FoundationDB client and protoc
      run: |
        sudo apt-get update && sudo apt-get install -y protobuf-compiler
        curl -LO https://github.com/apple/foundationdb/releases/download/7.3.43/foundationdb-clients_7.3.43-1_amd64.deb
        sudo dpkg -i foundationdb-clients_7.3.43-1_amd64.deb

    - name: Build Go packages
      run: go build -v ./...

    - name: Verify generated Go repository code is up-to-date
      run: |
        go build -o protoc-gen-fdb-go ./compiler/cmd/protoc-gen-fdb-go
        protoc -I proto -I tests/proto \
          --plugin=protoc-gen-fdb-go=./protoc-gen-fdb-go \
          --fdb-go_out=. --fdb-go_opt=module=github.com/romannikov/fdb-layer \
          tests/proto/store.proto
        rm -f protoc-gen-fdb-go
        git diff --exit-code tests/go/

    - name: Run Go unit tests
      run: go test -race -v ./...
