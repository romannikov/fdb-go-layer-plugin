# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Install FoundationDB client and protoc
      run: |
        sudo apt-get update && sudo apt-get install -y protobuf-compiler
        curl -LO https://github.com/apple/foundationdb/releases/download/7.3.43/foundationdb-clients_7.3.43-1_amd64.deb
        sudo dpkg -i foundationdb-clients_7.3.43-1_amd64.deb

    - name: Build
      run: go build -v ./...

    - name: Verify generated repository code is up-to-date
      run: |
        go build -o protoc-gen-fdb-go-layer .
        protoc --plugin=protoc-gen-fdb=./protoc-gen-fdb-go-layer --fdb_out=. --fdb_opt=paths=source_relative tests/store/store.proto tests/atomic/atomic.proto
        rm -f protoc-gen-fdb-go-layer
        git diff --exit-code tests/store/ tests/atomic/

    - name: Run unit tests
      run: go test -race -v ./...
