name: CI

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install FoundationDB client and protoc
      run: |
        sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev
        go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.1
        curl -LO https://github.com/apple/foundationdb/releases/download/7.3.43/foundationdb-clients_7.3.43-1_amd64.deb
        sudo dpkg -i foundationdb-clients_7.3.43-1_amd64.deb

    - name: Build Go packages
      run: go build -v ./...

    - name: Verify generated Go and Rust repository code is up-to-date
      run: |
        ./update_protos.sh
        git diff --exit-code proto/ tests/go/ tests/rust/

    - name: Run Go unit tests
      run: go test -race -v ./...

    - name: Check Rust runtime and generated repositories
      run: |
        cargo check --manifest-path runtimes/rust/Cargo.toml
        cargo check --manifest-path tests/rust/Cargo.toml --tests
